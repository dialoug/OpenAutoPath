name: Architecture

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: architecture-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  boundaries:
    name: Module boundaries and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check module boundaries
        run: cmake -DOAP_SOURCE_DIR="$GITHUB_WORKSPACE" -P cmake/CheckModuleBoundaries.cmake
      - name: Check SDK header closure
        run: cmake -DOAP_SOURCE_DIR="$GITHUB_WORKSPACE" -P cmake/CheckSdkHeaders.cmake
      - name: Check documentation links
        run: cmake -DOAP_SOURCE_DIR="$GITHUB_WORKSPACE" -P cmake/CheckDocumentationLinks.cmake
      - name: Check workflow boundaries
        run: cmake -DOAP_SOURCE_DIR="$GITHUB_WORKSPACE" -P cmake/CheckWorkflowBoundaries.cmake
      - name: Check external source grouping
        run: cmake -S cmake/fixtures/source_groups -B build/source-groups -DOAP_SOURCE_DIR="$GITHUB_WORKSPACE"
