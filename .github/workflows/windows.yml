name: Windows Web application

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/cache@v4
        with:
          path: external
          key: windows-occt-7.9.3-${{ hashFiles('tools/Install-WindowsOcct.ps1') }}
      - name: Install OCCT SDK
        run: ./tools/Install-WindowsOcct.ps1
      - name: Configure native worker
        run: cmake --preset windows-core "-DFETCHCONTENT_BASE_DIR=$env:RUNNER_TEMP/oap-dependencies"
      - name: Build native worker and tests
        run: cmake --build --preset windows-core
      - name: Run native tests
        run: |
          ctest --preset windows-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --preset windows-core-packaging
      - name: Install native worker
        run: cmake --install build/windows-core --config Release --component ServerWorker --prefix build/cam-server-package
      - name: Run HTTP and real-worker tests
        env:
          OAP_TEST_WORKER: ${{ github.workspace }}/build/cam-server-package/bin/oap-worker.exe
        run: go -C server test -count=1 ./...
      - name: Build HTTP server
        run: go -C server build -o ../build/cam-server-package/oap-server.exe ./cmd/oap-server
      - name: Build browser assets
        working-directory: web
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build -- --outDir ../build/cam-server-package/web
      - uses: actions/upload-artifact@v4
        with:
          name: openautopath-web-windows-x64
          path: build/cam-server-package/
          if-no-files-found: error
