name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package_version:
        description: Nonempty only when the caller requests a desktop ZIP
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: windows-vs2022
          - preset: windows-core
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - name: Verify SDK downloader
        run: ./tools/tests/Test-WindowsOcctDownload.ps1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.1'
          arch: win64_msvc2022_64
          modules: qtshadertools
          # aqtinstall 3.3.0 cannot resolve Qt 6.11's Windows repository layout.
          # Pin the upstream Qt 6.11 support fix instead of a moving branch.
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@7e5a5c3d95cf962cfc2f36c86ffa0d2c07f1a0d4
          cache: true
      - name: Cache OCCT SDK
        uses: actions/cache@v4
        with:
          path: external
          key: windows-occt-7.9.3-${{ hashFiles('tools/Install-WindowsOcct.ps1') }}
      - name: Install OCCT SDK
        run: ./tools/Install-WindowsOcct.ps1
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          "-DOAP_QT_ROOT=$env:QT_ROOT_DIR"
          "-DFETCHCONTENT_BASE_DIR=$env:RUNNER_TEMP/oap-dependencies"
      - name: Build application and tests
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Run fast tests
        run: ctest --preset ${{ matrix.preset }}
      - name: Verify installed package
        run: ctest --preset ${{ matrix.preset }}-packaging
      - name: Package desktop runtime
        if: matrix.preset == 'windows-vs2022' && inputs.package_version != ''
        env:
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: >-
          ./tools/Package-WindowsRelease.ps1
          -BuildDir build/windows-vs2022
          -Version $env:PACKAGE_VERSION
          -OutputDir artifacts/release
      - name: Upload desktop package
        if: matrix.preset == 'windows-vs2022' && inputs.package_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-package
          path: |
            artifacts/release/*.zip
            artifacts/release/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
